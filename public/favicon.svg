<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ARCHTRADE">
  <!--
    ARCHTRADE monogram.

    An A drawn as a roof truss rather than as a letterform: two rafters and a
    tie beam, which is the member that stops the rafters spreading and is the
    only reason the shape stands up. The tie beam is the bronze one.

    Square caps, no rounded joins, no gradient — the same rules the site is
    built on. Full-bleed graphite because a favicon sits against a browser
    chrome of unknown colour, and a transparent mark disappears into a dark
    theme.
  -->
  <rect width="32" height="32" fill="#23262A"/>
  <g fill="none" stroke-linecap="square">
    <!-- The two rafters, meeting at the apex. -->
    <path d="M6 25.5 16 6.5 26 25.5" stroke="#FBF9F5" stroke-width="2.6"/>
    <!-- The tie beam. Bronze, because it is the member doing the work. -->
    <path d="M10.4 18.2h11.2" stroke="#8C6D46" stroke-width="3.2"/>
  </g>
</svg>
